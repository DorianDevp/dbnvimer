[package]
name = "dbclient-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Rust core for DBClient.nvim"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
mysql = "25.0"
postgres = "0.19"
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
opt-level = 2
